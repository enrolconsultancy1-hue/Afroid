[project]
name = "afroid-incubate"
version = "1.0.0"
description = "Afroid Incubate — Non-dilutive funding matching, OCR, AI grant writing"
requires-python = ">=3.12"
dependencies = [
    "afroid-shared",
    "langchain-google-genai>=2.0.0",
    "google-cloud-vision>=3.7.0",
    "beautifulsoup4>=4.12.0",
    "rapidfuzz>=3.9.0",
    "spacy>=3.8.0",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.incubate.app", "services.incubate.app.engine", "services.incubate.app.routes", "services.incubate.app.schemas", "services.incubate.app.seeds", "services.incubate.tests"]
package-dir = {"services.incubate.app" = "app", "services.incubate.tests" = "tests"}
