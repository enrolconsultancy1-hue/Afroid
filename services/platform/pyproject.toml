[project]
name = "afroid-platform"
version = "1.0.0"
description = "Afroid Platform Service — Projects, Organizations, Billing"
requires-python = ">=3.12"
dependencies = [
    "afroid-shared",
    "stripe>=10.0.0",
    "python-slugify>=8.0.0",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.platform.app", "services.platform.app.models", "services.platform.app.routes", "services.platform.app.schemas", "services.platform.tests"]
package-dir = {"services.platform.app" = "app", "services.platform.tests" = "tests"}
