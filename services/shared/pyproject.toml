[project]
name = "afroid-shared"
version = "1.0.0"
description = "Shared utilities, models, and middleware for Afroid backend services"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.5",
    "motor>=3.6.0",
    "redis[hiredis]>=5.2.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "google-cloud-storage>=2.18.0",
    "google-cloud-pubsub>=2.23.0",
    "google-cloud-secret-manager>=2.20.0",
    "orjson>=3.10.0",
    "sentry-sdk>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.shared"]
package-dir = {"services.shared" = "."}
