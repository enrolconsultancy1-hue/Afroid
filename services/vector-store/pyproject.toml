[project]
name = "afroid-vector-store"
version = "1.0.0"
description = "Afroid Vector Store — Embedding generation and similarity search via pgvector"
requires-python = ">=3.12"
dependencies = [
    "afroid-shared",
    "langchain-google-genai>=2.0.0",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.vector_store.app", "services.vector_store.app.routes", "services.vector_store.app.schemas", "services.vector_store.app.services", "services.vector_store.tests"]
package-dir = {"services.vector_store.app" = "app", "services.vector_store.tests" = "tests"}
