[project]
name = "afroid-gateway"
version = "1.0.0"
description = "Afroid API Gateway - lightweight reverse proxy for local development"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.gateway.app"]
package-dir = {"services.gateway.app" = "app"}
