[project]
name = "afroid-workspace"
version = "1.0.0"
description = "Afroid Workspace Service - local filesystem, git, and terminal for the geezcodE IDE"
requires-python = ">=3.12"
dependencies = [
    "afroid-shared",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.workspace.app", "services.workspace.app.routes"]
package-dir = {"services.workspace.app" = "app"}
