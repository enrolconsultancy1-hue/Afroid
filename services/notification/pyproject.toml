[project]
name = "afroid-notification"
version = "1.0.0"
description = "Afroid Notification Service — Email and push notifications"
requires-python = ">=3.12"
dependencies = [
    "afroid-shared",
    "email-validator>=2.2.0",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.notification.app", "services.notification.app.routes", "services.notification.app.schemas", "services.notification.app.services", "services.notification.tests"]
package-dir = {"services.notification.app" = "app", "services.notification.tests" = "tests"}
