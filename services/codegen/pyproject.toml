[project]
name = "afroid-codegen"
version = "1.0.0"
description = "Afroid Code Generation Engine — AST/DSL pipeline and code generators"
requires-python = ">=3.12"
dependencies = [
    "afroid-shared",
    "langchain-google-genai>=2.0.0",
    "jinja2>=3.1.0",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.codegen.app", "services.codegen.app.engine", "services.codegen.app.routes", "services.codegen.app.schemas", "services.codegen.tests"]
package-dir = {"services.codegen.app" = "app", "services.codegen.tests" = "tests"}
