[project]
name = "afroid-auth"
version = "1.0.0"
description = "Afroid Authentication Service — JWT + OAuth2"
requires-python = ">=3.12"

dependencies = [
    "afroid-shared",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
]

[tool.uv.sources]
afroid-shared = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services.auth.app", "services.auth.app.middleware", "services.auth.app.models", "services.auth.app.routes", "services.auth.app.schemas", "services.auth.app.services", "services.auth.tests", "services.auth.tests.test_routes", "services.auth.tests.test_services"]
package-dir = {"services.auth.app" = "app", "services.auth.tests" = "tests"}
