<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>geezcodE ፩</> Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <span class="symbol-bracket">&lt;</span>
          <span class="symbol-geez">፩</span>
          <span class="symbol-bracket">/&gt;</span>
        </div>
        <div class="brand-text">
          <span class="brand-name"><span class="geez">geez</span><span class="code">codE</span></span>
          <span class="tagline">SOVEREIGN COPILOT</span>
        </div>
      </div>
      <a href="http://localhost:3000/dashboard/ide" target="_blank" class="ide-link" title="Open geezcodE IDE">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </header>

    <!-- Nav Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="architect">Architect</button>
      <button class="tab-btn" data-tab="autofill">Grant Autofill</button>
      <button class="tab-btn" data-tab="certify">RegTech</button>
    </nav>

    <!-- Tab 1: Architect Quick-Intake -->
    <div id="tab-architect" class="tab-content active">
      <div class="field-group">
        <label for="concept-input">Startup Concept (Zero-Question Intake)</label>
        <textarea id="concept-input" rows="3" placeholder="e.g. Cross-border livestock insurance with automated satellite weather verification"></textarea>
      </div>
      <button id="btn-generate-blueprint" class="btn btn-primary">
        <span>⚡ Formulate Blueprint in IDE</span>
      </button>
      <div id="architect-status" class="status-box hidden"></div>
    </div>

    <!-- Tab 2: Grant Autofill -->
    <div id="tab-autofill" class="tab-content">
      <p class="tab-desc">Auto-map startup profile into open grant forms on this webpage.</p>
      <div class="stats-row">
        <div class="stat-badge">
          <span class="stat-label">Funding Catalog</span>
          <span class="stat-value">$3B+</span>
        </div>
        <div class="stat-badge">
          <span class="stat-label">AI Accuracy</span>
          <span class="stat-value">94.8%</span>
        </div>
      </div>
      <button id="btn-autofill-page" class="btn btn-primary">
        <span>🪄 Autofill Active Page</span>
      </button>
      <div id="autofill-status" class="status-box hidden"></div>
    </div>

    <!-- Tab 3: RegTech Compliance -->
    <div id="tab-certify" class="tab-content">
      <div class="field-group">
        <label for="select-country">Target African Jurisdiction</label>
        <select id="select-country" class="select-input">
          <option value="nigeria">Nigeria (Startup Act 2022)</option>
          <option value="kenya">Kenya (Startup Bill 2024)</option>
          <option value="ethiopia">Ethiopia (National Startup Policy)</option>
          <option value="au">African Union (AU Framework)</option>
        </select>
      </div>
      <button id="btn-run-audit" class="btn btn-secondary">
        <span>🛡️ Run Instant Compliance Audit</span>
      </button>
      <div id="certify-result" class="certify-box hidden"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-status"><span class="dot"></span> Connected: GCP africa-south1</span>
      <span class="footer-version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
