[project]
name = "afroid-kyc"
version = "1.0.0"
description = "Afroid KYC — Python Mobile App for Sovereign African Founder Verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.23.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
