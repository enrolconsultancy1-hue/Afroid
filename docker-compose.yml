# ============================================
# Afroid — Local Development Stack
# ============================================
# Usage: docker compose up -d
# ============================================

services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: afroid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: afroid
      POSTGRES_PASSWORD: afroid_dev
      POSTGRES_DB: afroid
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afroid"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: afroid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB 7
  mongodb:
    image: mongo:7
    container_name: afroid-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: afroid
      MONGO_INITDB_ROOT_PASSWORD: afroid_dev
      MONGO_INITDB_DATABASE: afroid
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Commander (Dev UI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: afroid-redis-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    profiles:
      - tools

  # Mongo Express (Dev UI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: afroid-mongo-ui
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: afroid
      ME_CONFIG_MONGODB_ADMINPASSWORD: afroid_dev
      ME_CONFIG_MONGODB_URL: mongodb://afroid:afroid_dev@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    profiles:
      - tools

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  mongodata:
    driver: local
