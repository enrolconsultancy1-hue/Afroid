name: Afroid CD Deployment Pipeline

# ---------------------------------------------------------------------------
# SAFETY MODEL
#   * A push to main ONLY builds and pushes container images. It NEVER deploys.
#   * Deployment to Cloud Run runs ONLY on a manual "Run workflow"
#     (workflow_dispatch), because the live services carry hand-tuned runtime
#     config — Cloud SQL Auth Proxy, VPC connector, dedicated least-privilege
#     service account, and per-service gateway upstream URLs. The deploy job
#     below encodes that live config; keep it in sync with reality and verify
#     before each manual deploy.
#   * This prevents an accidental push from stripping the Cloud SQL / VPC
#     settings and breaking database connectivity across the platform.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: "afroid-506916"
  REGION: "us-central1"
  REGISTRY: "us-central1-docker.pkg.dev/afroid-506916/afroid-containers"
  SERVICE_ACCOUNT: "afroid-cloudrun-prod@afroid-506916.iam.gserviceaccount.com"
  CLOUDSQL_INSTANCE: "afroid-506916:us-central1:afroid-db-prod"
  VPC_CONNECTOR: "afroid-vpc-conn-prod"
  # Real Secret Manager bindings (env var name = secret name:version).
  SECRET_ENV: "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET_KEY=JWT_SECRET_KEY:latest,GEMINI_API_KEY=GOOGLE_API_KEY:latest"
  # Backend services that connect to the database (exclude gateway + web).
  BACKENDS: "auth platform orchestrator certify incubate vector-store codegen notification workspace intake"

jobs:
  build:
    name: Build & Push Images (runs on every push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/629240539505/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "deployer-sa@afroid-506916.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push all service images
        run: |
          set -euo pipefail
          for svc in $BACKENDS gateway; do
            SVC_DIR="${svc//-/_}"
            IMAGE="${REGISTRY}/${svc}:${GITHUB_SHA}"
            echo "==> Building ${svc}"
            docker build -t "$IMAGE" -f "services/${SVC_DIR}/Dockerfile" .
            docker push "$IMAGE"
          done
          echo "==> Building web"
          WEB_IMAGE="${REGISTRY}/web:${GITHUB_SHA}"
          docker build -t "$WEB_IMAGE" -f apps/web/Dockerfile .
          docker push "$WEB_IMAGE"

  deploy:
    name: Deploy to Cloud Run (manual dispatch only)
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/629240539505/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "deployer-sa@afroid-506916.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend services
        run: |
          set -euo pipefail
          for svc in $BACKENDS; do
            echo "==> Deploying afroid-${svc}-prod"
            gcloud run deploy "afroid-${svc}-prod" \
              --image "${REGISTRY}/${svc}:${GITHUB_SHA}" \
              --region "$REGION" \
              --platform managed \
              --service-account "$SERVICE_ACCOUNT" \
              --add-cloudsql-instances "$CLOUDSQL_INSTANCE" \
              --vpc-connector "$VPC_CONNECTOR" \
              --vpc-egress private-ranges-only \
              --set-env-vars "APP_ENV=production,VERTEX_REGION=${REGION}" \
              --set-secrets "$SECRET_ENV" \
              --allow-unauthenticated \
              --quiet
          done

      - name: Deploy API gateway
        run: |
          set -euo pipefail
          RUN="kx4jycljfa-uc.a.run.app"
          # Use a custom '##' delimiter because CORS_ORIGINS itself contains commas.
          GW_ENV="^##^GATEWAY_AUTH_URL=https://afroid-auth-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_PLATFORM_URL=https://afroid-platform-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_CERTIFY_URL=https://afroid-certify-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_INCUBATE_URL=https://afroid-incubate-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_ORCHESTRATOR_URL=https://afroid-orchestrator-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_CODEGEN_URL=https://afroid-codegen-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_VECTOR_STORE_URL=https://afroid-vector-store-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_NOTIFICATION_URL=https://afroid-notification-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_WORKSPACE_URL=https://afroid-workspace-prod-${RUN}"
          GW_ENV="${GW_ENV}##GATEWAY_INTAKE_URL=https://afroid-intake-prod-${RUN}"
          GW_ENV="${GW_ENV}##CORS_ORIGINS=https://afroid-web-prod-629240539505.us-central1.run.app,https://afroid-web-prod-${RUN},https://app.afroid.io"
          gcloud run deploy "afroid-gateway-prod" \
            --image "${REGISTRY}/gateway:${GITHUB_SHA}" \
            --region "$REGION" \
            --platform managed \
            --service-account "$SERVICE_ACCOUNT" \
            --vpc-connector "$VPC_CONNECTOR" \
            --vpc-egress private-ranges-only \
            --set-env-vars "$GW_ENV" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy web frontend
        run: |
          set -euo pipefail
          gcloud run deploy "afroid-web-prod" \
            --image "${REGISTRY}/web:${GITHUB_SHA}" \
            --region "$REGION" \
            --port 3000 \
            --platform managed \
            --service-account "$SERVICE_ACCOUNT" \
            --vpc-connector "$VPC_CONNECTOR" \
            --vpc-egress private-ranges-only \
            --set-env-vars "APP_ENV=production,VERTEX_REGION=${REGION}" \
            --allow-unauthenticated \
            --quiet
