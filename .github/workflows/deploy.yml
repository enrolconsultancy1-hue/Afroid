name: Afroid CD Deployment Pipeline

on:
  push:
    branches: [main]

env:
  PROJECT_ID: "afroid-506916"
  REGION: "us-central1"
  REGISTRY: "us-central1-docker.pkg.dev/afroid-506916/afroid-containers"
  SERVICE_ACCOUNT: "afroid-cloudrun-prod@afroid-506916.iam.gserviceaccount.com"

jobs:
  deploy:
    name: Build & Deploy to Cloud Run (us-central1 Primary / Global)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/629240539505/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "deployer-sa@afroid-506916.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Deploy Microservices
        run: |
          # Services that must be publicly accessible (allUsers invoker)
          PUBLIC_SERVICES=("gateway" "web")

          # All backend microservices
          SERVICES=("auth" "platform" "orchestrator" "certify" "incubate" "vector-store" "codegen" "notification" "workspace" "intake" "gateway")

          # Shared secrets from Secret Manager (name:version)
          SECRET_ENV="JWT_SECRET_KEY=afroid-jwt-secret-prod:latest"
          SECRET_ENV="$SECRET_ENV,DATABASE_URL=afroid-db-password-prod:latest"
          SECRET_ENV="$SECRET_ENV,GEMINI_API_KEY=afroid-gemini-api-key-prod:latest"
          SECRET_ENV="$SECRET_ENV,SENDGRID_API_KEY=afroid-sendgrid-api-key-prod:latest"

          # Shared env vars
          ENV_VARS="APP_ENV=production,VERTEX_REGION=${REGION}"

          for svc in "${SERVICES[@]}"; do
            echo "===================================================="
            echo "🚀 Building & Deploying service: $svc"
            echo "===================================================="

            SVC_DIR="${svc//-/_}"
            IMAGE_URI="${REGISTRY}/${svc}:${GITHUB_SHA}"

            # Build container image
            docker build -t "$IMAGE_URI" -f "services/${SVC_DIR}/Dockerfile" .
            docker push "$IMAGE_URI"

            # Determine auth flag
            AUTH_FLAG="--no-allow-unauthenticated"
            for pub in "${PUBLIC_SERVICES[@]}"; do
              if [ "$svc" = "$pub" ]; then
                AUTH_FLAG="--allow-unauthenticated"
                break
              fi
            done

            # Deploy to Google Cloud Run with secrets and env vars
            gcloud run deploy "afroid-${svc}-prod" \
              --image "$IMAGE_URI" \
              --region "$REGION" \
              --platform managed \
              --service-account "$SERVICE_ACCOUNT" \
              --set-env-vars "$ENV_VARS" \
              --set-secrets "$SECRET_ENV" \
              $AUTH_FLAG \
              --quiet
          done

      - name: Build and Deploy Web Frontend
        run: |
          echo "===================================================="
          echo "🚀 Building & Deploying Web Frontend"
          echo "===================================================="
          IMAGE_URI="${REGISTRY}/web:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" -f apps/web/Dockerfile .
          docker push "$IMAGE_URI"
          gcloud run deploy "afroid-web-prod" \
            --image "$IMAGE_URI" \
            --region "$REGION" \
            --port 3000 \
            --platform managed \
            --set-env-vars "APP_ENV=production" \
            --allow-unauthenticated \
            --quiet
